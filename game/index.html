<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Run — A Turkey Escape</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #2b1a08;
    height: 100%;
